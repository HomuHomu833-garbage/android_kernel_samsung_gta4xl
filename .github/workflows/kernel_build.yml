
name: Build Kernel on Github Actions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: panchajanya1999/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        device: [a50, a50s, a51, f41, gta4xl, gta4xlwifi, m21, m30sdd, m31, m31s, xcoverproxx]
    steps:
      - name: Setup env
        run: pacman -Sy --noconfirm && pacman -S archlinux-keyring --noconfirm && pacman -Syu --needed --noconfirm aarch64-linux-gnu-binutils wget base-devel xmlto libxml2 libxml2-legacy inetutils bc cpio python-sphinx python-sphinx_rtd_theme graphviz imagemagick git python zip github-cli fortune-mod jre8-openjdk
      - uses: actions/checkout@v4
      - name: Add repo as a safe directory
        run: git config --global --add safe.directory $(pwd)
      - name: Checkout submodules
        run: git submodule update --init --recursive --remote
      - name: Build Kernel
        run: bash ci_build.sh ${{ matrix.device }} ksu.config
      - name: Upload kernel package to artifacts
        uses: actions/upload-artifact@v4
        with:
         name: Kernel-${{ matrix.device }}
         path: AnyKernel3/package.zip
